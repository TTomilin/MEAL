[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meal_bench"
version = "0.3.1"
description = "MEAL: A Benchmark for Continual Multi-Agent Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tristan Tomilin", email = "tristan.tomilin@hotmail.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "chex",
    "distrax",
    "flashbax",
    "flax",
    "gymnax",
    "jax",
    "pyyaml",
    "tensorboard",
    "tensorboardX",
    "tyro",
    "wandb",
]

[project.optional-dependencies]
viz = [
    "imageio",
    "imageio[ffmpeg]",
    "ipython",
    "ipywidgets",
    "jinja2",
    "matplotlib",
    "pillow",
    "pygame",
    "scipy",
    "seaborn",
]
utils = [
    "numpy",
    "optax",
    "orbax-checkpoint",
    "pandas",
    "pytest",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/TTomilin/MEAL"

[tool.setuptools.packages.find]
where = ["."]
include = ["meal*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
meal = [
    "visualization/data/**/*",
]

[tool.pytest.ini_options]
# Ensures `meal` is importable during collection regardless of cwd, since the
# editable install's finder mapping does not cover the top-level `meal` package.
pythonpath = ["."]
testpaths = ["tests"]
